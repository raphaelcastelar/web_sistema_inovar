# Qualquer acesso HTTP por IP público ou host desconhecido é encerrado.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# Sistema completo: exclusivamente pela rede ZeroTier.
server {
    listen 80;
    server_name sistema.inovar;

    allow 192.168.196.0/24;
    deny all;

    root /opt/apps/web_sistema_inovar/sistema_inovar/frontend/build;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    location /static/admin/ {
        alias /opt/apps/web_sistema_inovar/sistema_inovar/staticfiles/admin/;
    }

    location /static/rest_framework/ {
        alias /opt/apps/web_sistema_inovar/sistema_inovar/staticfiles/rest_framework/;
    }

    location /static/ {
        root /opt/apps/web_sistema_inovar/sistema_inovar/frontend/build;
        try_files $uri =404;
    }

    location /media/ {
        alias /srv/sistema-inovar/arquivos/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Redireciona somente o webhook HTTP para HTTPS, preservando o POST.
server {
    listen 80;
    server_name bbhook.inovarcontabilidadeibatiba.com.br;

    location = /api/webhook/bb-cobranca/ {
        return 308 https://bbhook.inovarcontabilidadeibatiba.com.br$request_uri;
    }

    location = /api/webhook/inter-cobranca/ {
        return 308 https://bbhook.inovarcontabilidadeibatiba.com.br$request_uri;
    }

    location / {
        return 404;
    }
}

# Recusa HTTPS por IP ou hostname desconhecido.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Serviços públicos isolados: webhook do Banco do Brasil e API do aplicativo.
server {
    listen 443 ssl;
    server_name bbhook.inovarcontabilidadeibatiba.com.br;

    ssl_certificate /etc/letsencrypt/live/bbhook.inovarcontabilidadeibatiba.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbhook.inovarcontabilidadeibatiba.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    # Somente a API segregada para clientes. As rotas administrativas em /api/
    # continuam inacessíveis pela internet.
    location ^~ /api/mobile/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30;
        proxy_send_timeout 180;
        proxy_read_timeout 180;
        send_timeout 180;
    }

    location = /api/webhook/bb-cobranca/ {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    location = /api/webhook/inter-cobranca/ {
        limit_except POST {
            deny all;
        }

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    location / {
        return 404;
    }
}
